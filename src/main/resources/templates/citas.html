<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Citas')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <div th:replace="~{fragments :: avisos}"></div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0">Citas (<span th:text="${#lists.size(citas)}">0</span>)</h2>
            <div class="acts">
                <a class="btn sm" th:classappend="${filtro != 'pendiente_pago'} ? 'sec'" th:href="@{/citas(estado='pendiente_pago')}">Pendientes de pago</a>
                <a class="btn sm" th:classappend="${filtro != 'pagada'} ? 'sec'" th:href="@{/citas(estado='pagada')}">Pagadas</a>
                <a class="btn sm" th:classappend="${filtro != 'atendida'} ? 'sec'" th:href="@{/citas(estado='atendida')}">Atendidas</a>
                <a class="btn sm" th:classappend="${filtro != 'todas'} ? 'sec'" th:href="@{/citas(estado='todas')}">Todas</a>
            </div>
        </div>
        <div class="scroll">
            <table>
                <tr><th>Código</th><th>Paciente</th><th>Cita</th><th>Pago</th><th>Estado</th><th></th></tr>
                <tr th:each="c : ${citas}">
                    <td><b th:text="${c.codigo}">TC-XXXXX</b></td>
                    <td><span th:text="${c.pacienteNombre}">Paciente</span><br><span class="muted" th:text="'DNI ' + ${c.pacienteDni}">DNI</span></td>
                    <td><span th:text="${c.fecha} + ' ' + (${c.hora} != null ? ${#strings.substring(c.hora, 0, 5)} : '')">fecha</span><br>
                        <span class="muted" th:text="(${c.doctor} != null ? ${c.doctor.nombre} : '') + ' · ' + (${c.especialidad} != null ? ${c.especialidad.nombre} : '')">doctor</span></td>
                    <td><span th:text="${c.metodoPago}">yape</span>
                        <span th:if="${c.metodoPago == 'yape'}" class="muted"><br>Cel: <span th:text="${c.yapeCelular} ?: '—'">—</span><br>Cód: <span th:text="${c.yapeCodigo} ?: '—'">—</span></span></td>
                    <td><span class="tag"
                              th:classappend="${c.estado == 'pendiente_pago'} ? 'warn' : (${c.estado == 'pagada' or c.estado == 'atendida'} ? 'ok' : 'bad')"
                              th:text="${nombresEstado[c.estado]} ?: ${c.estado}">Estado</span></td>
                    <td>
                        <div class="acts">
                            <form class="inline" th:if="${c.estado == 'pendiente_pago'}" th:action="@{/citas/{id}/estado(id=${c.id})}" method="post"
                                  onsubmit="return confirm('¿Confirmar que el pago llegó a su Yape?')">
                                <input type="hidden" name="estado" value="pagada"><input type="hidden" name="filtro" th:value="${filtro}">
                                <button class="btn ok sm" type="submit">Confirmar pago</button>
                            </form>
                            <form class="inline" th:if="${c.estado == 'pagada'}" th:action="@{/citas/{id}/estado(id=${c.id})}" method="post">
                                <input type="hidden" name="estado" value="atendida"><input type="hidden" name="filtro" th:value="${filtro}">
                                <button class="btn ok sm" type="submit">Atendida</button>
                            </form>
                            <form class="inline" th:if="${c.estado == 'pendiente_pago' or c.estado == 'pagada'}" th:action="@{/citas/{id}/estado(id=${c.id})}" method="post"
                                  onsubmit="return confirm('¿Cancelar esta cita? El horario quedará libre.')">
                                <input type="hidden" name="estado" value="cancelada"><input type="hidden" name="filtro" th:value="${filtro}">
                                <button class="btn bad sm" type="submit">Cancelar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(citas)}"><td colspan="6" class="muted">No hay citas en esta vista.</td></tr>
            </table>
        </div>
        <p class="muted">Para Yape: abra su app Yape, busque el yapeo del celular y código indicados, y luego pulse <b>Confirmar pago</b>.</p>
    </div>
</main>
</body>
</html>
