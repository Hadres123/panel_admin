<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ingresar')}"></head>
<body>
<main>
    <div class="login card">
        <h2>Panel administrador</h2>
        <p class="muted">Policlínico Infantil · Solo personal autorizado</p>
        <div class="aviso err" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
        <div class="aviso err" th:if="${param.limite}">Demasiados intentos. Espere 10 minutos e intente de nuevo.</div>
        <div class="aviso ok" th:if="${param.salio}">Sesión cerrada.</div>
        <form th:action="@{/login}" method="post" style="display:grid;gap:12px">
            <label>Usuario<input name="username" required autofocus autocomplete="username"></label>
            <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
            <button class="btn" type="submit">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
