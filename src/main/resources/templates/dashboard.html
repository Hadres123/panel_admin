<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Inicio')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <div th:replace="~{fragments :: avisos}"></div>
    <div class="stats">
        <div class="stat"><b th:text="${doctoresActivos}">0</b>Doctores activos</div>
        <div class="stat"><b th:text="${totalEspecialidades}">0</b>Especialidades</div>
        <div class="stat"><b th:text="${citasHoy}">0</b>Citas de hoy</div>
        <div class="stat"><b th:text="${totalPendientes}">0</b>Pagos por confirmar</div>
    </div>
    <div class="card">
        <div class="toolbar">
            <h2 style="margin:0">Últimos pagos pendientes</h2>
            <a class="btn sec sm" th:href="@{/citas}">Ver todos</a>
        </div>
        <div class="scroll">
            <table>
                <tr><th>Código</th><th>Paciente</th><th>Cita</th><th>Pago</th></tr>
                <tr th:each="c : ${pendientes}">
                    <td><b th:text="${c.codigo}">TC-XXXXX</b></td>
                    <td th:text="${c.pacienteNombre}">Paciente</td>
                    <td th:text="${c.fecha} + ' ' + (${c.hora} != null ? ${#strings.substring(c.hora, 0, 5)} : '')">fecha</td>
                    <td th:text="${c.metodoPago}">yape</td>
                </tr>
                <tr th:if="${#lists.isEmpty(pendientes)}"><td colspan="4" class="muted">No hay pagos pendientes. 🎉</td></tr>
            </table>
        </div>
    </div>
</main>
</body>
</html>
