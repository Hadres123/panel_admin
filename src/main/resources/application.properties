spring.application.name=policlinico-admin
server.port=${PORT:8082}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Sesion del panel
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En Render (HTTPS) poner COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Backend Java del policlinico (el que ya esta en Render). El panel habla con el SERVIDOR a servidor,
# por eso no necesita CORS y las credenciales del backend nunca llegan al navegador.
app.backend.url=${BACKEND_URL:http://localhost:8081}
app.backend.user=${BACKEND_USER:admin}
app.backend.password=${BACKEND_PASSWORD:}

# Usuario y clave para ENTRAR a este panel (distintos a los del backend). Sin PANEL_PASSWORD nadie entra.
app.panel.user=${PANEL_USER:admin}
app.panel.password=${PANEL_PASSWORD:}
